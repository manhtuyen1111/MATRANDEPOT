<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b2545" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font tải song song, không chặn hiển thị (chưa có font thì dùng font hệ thống) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'" />
    <title>MATRAN DEPOT — Hệ thống ERP Quản lý Bãi Container Rỗng</title>
    <style>
      /* Màn chờ hiện NGAY khi mở trang (trước khi tải xong app) — React thay thế khi chạy */
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #f5f7fa; font-family: system-ui, "Segoe UI", sans-serif; }
      .boot-logo { width: 64px; height: 64px; border-radius: 16px; background: #0b2545; color: #fff; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 32px rgba(11, 37, 69, 0.16); }
      .boot-name { font-weight: 800; color: #0f1f30; }
      .boot-step { font-size: 14px; color: #5a6a7b; }
      .boot-bar { position: fixed; top: 0; left: 0; right: 0; height: 4px; overflow: hidden; background: #eaf0f7; }
      .boot-bar::after { content: ""; display: block; width: 33%; height: 100%; background: #0b2545; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    </style>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root">
      <div class="boot" role="status">
        <div class="boot-bar"></div>
        <div class="boot-logo">M</div>
        <div class="boot-name">MATRAN DEPOT</div>
        <div class="boot-step">Đang mở ứng dụng…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
