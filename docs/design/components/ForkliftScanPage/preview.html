<!-- @dsCard group="Màn mẫu" height=760 width=400 page subtitle="Xe nâng · Chờ hạ vỏ — điện thoại (dữ liệu ví dụ)" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0;padding:24px;background:var(--canvas);font-family:var(--font-sans);font-size:14px;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-h);padding:0 18px;border-radius:var(--radius-md);font:600 14px var(--font-sans);cursor:pointer}
.btn-p{background:var(--navy-900);color:var(--surface);border:0}.btn-p:hover{background:var(--navy-700)}
.btn-s{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}.btn-s:hover{background:var(--canvas)}
.btn:focus-visible,.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.lbl{display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--ink-muted)}
.inp{box-sizing:border-box;width:100%;height:var(--control-h);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 12px;font:14px var(--font-sans);color:var(--ink);background:var(--surface)}
.mono{font-family:var(--font-mono)}.cno{font:700 13px var(--font-mono)}.link{font:500 13px var(--font-mono);color:var(--navy-700);text-decoration:none}.link:hover{text-decoration:underline}
.op{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--surface)}
.op-h{background:var(--op-ha-vo)}.op-c{background:var(--op-cap-vo)}.op-n{background:var(--op-nhap-tau)}.op-x{background:var(--op-xuat-tau);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg)}</style>
<style>body{padding:0;background:var(--canvas)}.wrap{max-width:512px;margin:0 auto;padding:16px;display:grid;gap:16px}.btn{height:var(--control-h-touch);font-size:16px;width:100%}
.scan{background:var(--navy-900);color:var(--surface);border-radius:var(--radius-lg);padding:20px;display:grid;gap:12px}.scan .no{font:700 40px/44px var(--font-mono);letter-spacing:.01em}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv div{background:rgba(255,255,255,.08);border-radius:var(--radius-md);padding:8px 12px}.kv small{display:block;font-size:12px;opacity:.7}.kv b{font-weight:600}
.slot{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot button{height:var(--control-h-touch);border-radius:var(--radius-md);border:1px solid var(--line-strong);background:var(--surface);font:600 16px var(--font-sans);color:var(--ink)}.slot .sel{background:var(--navy-50);border-color:var(--navy-900)}
.q{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg)}</style>
<div class="wrap">
<div><div style="font-size:12px;color:var(--ink-muted)">Bộ phận Xe nâng</div><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0;font-size:20px;font-weight:600">Chờ hạ vỏ</h1><span style="background:var(--pending);color:var(--ink);border-radius:var(--radius-full);padding:2px 10px;font-weight:700">5</span></div></div>
<div class="scan"><span class="op op-h" style="justify-self:start">Hạ vỏ</span><div class="no">MSKU1234565</div><div class="kv"><div><small>Size / Type</small><b>40 HC</b></div><div><small>Trạng thái</small><b>AV · Hàng sạch</b></div></div></div>
<div class="card" style="padding:16px;display:grid;gap:12px"><div style="display:flex;justify-content:space-between"><span class="lbl" style="margin:0">Chọn vị trí</span><span class="mono" style="font-weight:700">A / 17 - 02 - ?</span></div><div class="slot"><button>01</button><button class="sel">02</button><button>03</button><button>04</button></div><div style="font-size:12px;color:var(--ink-muted)">Bước 4/4 · Chọn Tier</div></div>
<button class="btn btn-p">Xác nhận đã hạ</button>
<div style="font-size:12px;color:var(--ink-muted);margin-top:8px">Đang chờ</div>
<div class="q"><span class="op op-n">Nhập tàu</span><div><span class="cno">SEGU4471209</span> · 40 GP<div style="font-size:12px;color:var(--ink-muted)">Tàu ví dụ · cổng 2</div></div></div>
<div class="q"><span class="op op-h">Hạ vỏ</span><div><span class="cno">CAIU7712340</span> · 20 GP<div style="font-size:12px;color:var(--ink-muted)">Vào cổng 08:42:10</div></div></div>
<button class="btn btn-s">Xem thêm</button></div>
