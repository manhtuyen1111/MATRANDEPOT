<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>body{margin:0;padding:24px;background:var(--canvas);font-family:var(--font-sans);font-size:14px;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:var(--control-h);padding:0 18px;border-radius:var(--radius-md);font:600 14px var(--font-sans);cursor:pointer}
.btn-p{background:var(--navy-900);color:var(--surface);border:0}.btn-p:hover{background:var(--navy-700)}
.btn-s{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}.btn-s:hover{background:var(--canvas)}
.btn:focus-visible,.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.lbl{display:block;margin-bottom:6px;font-size:12px;font-weight:500;color:var(--ink-muted)}
.inp{box-sizing:border-box;width:100%;height:var(--control-h);border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 12px;font:14px var(--font-sans);color:var(--ink);background:var(--surface)}
.mono{font-family:var(--font-mono)}.cno{font:700 13px var(--font-mono)}.link{font:500 13px var(--font-mono);color:var(--navy-700);text-decoration:none}.link:hover{text-decoration:underline}
.op{display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);padding:3px 8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--surface)}
.op-h{background:var(--op-ha-vo)}.op-c{background:var(--op-cap-vo)}.op-n{background:var(--op-nhap-tau)}.op-x{background:var(--op-xuat-tau);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg)}</style>
<div style="display:grid;gap:16px;max-width:360px"><label><span class="lbl">Số container</span><input class="inp mono" value="MSKU1234565"></label><label><span class="lbl">Số xe</span><input class="inp" value="51C-12" style="border-color:var(--danger-fg)"><span style="display:block;margin-top:6px;font-size:12px;color:var(--danger-fg)">Biển số chưa đủ. Nhập dạng 51C-123.45.</span></label></div>
